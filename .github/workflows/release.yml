name: Create Release Zip

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.release.target_commitish }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Compute version (strip leading 'v')
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}   # "v1.0.0"
          TAG=${TAG#v}                   # "1.0.0"
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Update version in Info.xml
        run: |
          sed -i "s|<Version>.*</Version>|<Version>${{ steps.version.outputs.version }}</Version>|" fomod/Info.xml

      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fomod/Info.xml
          if ! git diff --cached --quiet; then
            git commit -m "ci: bump Info.xml to version ${{ steps.version.outputs.version }}"
            git push origin HEAD:${{ github.event.release.target_commitish }}
          fi

      - name: Append changelog from release info
        run: |
          VERSION=${{ steps.version.outputs.version }}
          RELEASE_TITLE="${{ github.event.release.name }}"
          RELEASE_BODY="${{ github.event.release.body }}"
          DATE=$(date +"%Y-%m-%d")

          echo -e "\n## [$VERSION] - $DATE" >> temp_changelog.md

          if [ -n "$RELEASE_BODY" ]; then
            echo -e "\n$RELEASE_BODY\n" >> temp_changelog.md
          fi

          if [ -f CHANGELOG.md ]; then
            awk '
              /^## \[Unreleased\]/ {
                print;
                print "";
                print "## [" VERSION "] - " DATE;
                if (BODY != "") {
                  print "";
                  print BODY;
                }
                next
              }
              1' VERSION="$VERSION" DATE="$DATE" BODY="$RELEASE_BODY" CHANGELOG.md > CHANGELOG.tmp
          else
            cat temp_changelog.md > CHANGELOG.tmp
          fi

          mv CHANGELOG.tmp CHANGELOG.md
          rm temp_changelog.md

      - name: Commit updated changelog
        run: |
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update CHANGELOG.md for v${{ steps.version.outputs.version }}"
            git push origin HEAD:${{ github.event.release.target_commitish }}
          fi

      - name: List repository contents
        run: ls -R

      - name: Strip Lua comments
        run: |
          find data -name "*.lua" | while IFS= read -r f; do
            python3 - "$f" <<'PYEOF'
import sys, re

def strip_asm_block(inner):
    lines = inner.split('\n')
    out = []
    for line in lines:
        idx = line.find(';')
        stripped = line[:idx].rstrip() if idx != -1 else line
        if idx != -1 and stripped.strip() == '':
            continue
        out.append(stripped)
    text = '\n'.join(out)
    return re.sub(r'\n{3,}', '\n\n', text)

def strip_lua(src):
    out = []
    i = 0
    n = len(src)
    first_line_kept = False
    while i < n:
        if src[i:i+4] == '--[[':
            end = src.find(']]', i + 4)
            i = (end + 2) if end != -1 else n
            if i < n and src[i] == '\n':
                i += 1
        elif src[i:i+2] == '--' and src[i+2:i+3] != '[':
            sol = src.rfind('\n', 0, i)
            sol = sol + 1 if sol != -1 else 0
            before = src[sol:i]
            eol = src.find('\n', i)
            eol_next = (eol + 1) if eol != -1 else n
            if before.strip() == '':
                if not first_line_kept and sol == 0:
                    first_line_kept = True
                    out.append(src[i:eol_next] if eol != -1 else src[i:])
                else:
                    to_remove = len(before)
                    if to_remove > 0:
                        tail = ''.join(out[-to_remove:])
                        if tail == before:
                            del out[-to_remove:]
                i = eol_next
            else:
                to_remove = len(before)
                if to_remove > 0:
                    tail = ''.join(out[-to_remove:])
                    if tail == before:
                        del out[-to_remove:]
                out.append(before.rstrip())
                i = eol_next if eol != -1 else n
                if eol != -1:
                    out.append('\n')
        elif src[i] in ('"', "'"):
            q = src[i]
            out.append(src[i]); i += 1
            while i < n and src[i] != q:
                if src[i] == '\\':
                    out.append(src[i]); i += 1
                if i < n:
                    out.append(src[i]); i += 1
            if i < n:
                out.append(src[i]); i += 1
        elif src[i:i+2] == '[[':
            end = src.find(']]', i + 2)
            if end != -1:
                inner = src[i+2:end]
                out.append('[[' + strip_asm_block(inner) + ']]')
                i = end + 2
            else:
                out.append(src[i]); i += 1
        else:
            out.append(src[i]); i += 1
    result = ''.join(out)
    result = re.sub(r'\n{3,}', '\n\n', result)
    return result.strip() + '\n'

path = sys.argv[1]
with open(path, 'r', encoding='utf-8') as fh:
    src = fh.read()
with open(path, 'w', encoding='utf-8') as fh:
    fh.write(strip_lua(src))
PYEOF
          done

      - name: Install 7zip
        run: sudo apt-get install -y p7zip-full

      - name: Compress data and fomod folders
        run: |
          REPO=${{ github.event.repository.name }}
          VERSION=${{ steps.version.outputs.version }}
          ARCHIVE_NAME="$REPO-$VERSION.7z"
          if [ -d "data" ] && [ -d "fomod" ]; then
            7z a -t7z -mx=9 "$ARCHIVE_NAME" data fomod
          else
            echo "Folders 'data' or 'fomod' not found."
            exit 1
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ github.event.repository.name }}-${{ steps.version.outputs.version }}.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
